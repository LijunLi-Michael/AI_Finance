<svg xmlns="http://www.w3.org/2000/svg" width="920" height="600" viewBox="0 0 920 600" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="920" height="600" fill="#ffffff"/>
  <style>
    .t{fill:#0f172a} .m{fill:#64748b} .w{fill:#ffffff}
    .lbl{font-weight:700} .sub{font-size:13px} .tiny{font-size:12px}
  </style>

  <!-- Students -->
  <rect x="330" y="24" width="260" height="56" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="460" y="48" text-anchor="middle" class="t lbl" font-size="16">Students — in class, live in the browser</text>
  <text x="460" y="68" text-anchor="middle" class="m sub">they trade on these, not on a third-party exchange</text>

  <!-- arrow students -> engine -->
  <line x1="460" y1="80" x2="460" y2="118" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="460,128 454,116 466,116" fill="#94a3b8"/>

  <!-- Engine -->
  <rect x="250" y="130" width="420" height="78" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="460" y="162" text-anchor="middle" class="t lbl" font-size="19">ONE matching engine (CLOB)</text>
  <text x="460" y="188" text-anchor="middle" class="m sub">hand-built from scratch · order book + matching + settlement + a market maker</text>

  <!-- fan-out arrows -->
  <line x1="460" y1="208" x2="460" y2="232" stroke="#94a3b8" stroke-width="2"/>
  <line x1="150" y1="232" x2="770" y2="232" stroke="#94a3b8" stroke-width="2"/>
  <line x1="150" y1="232" x2="150" y2="262" stroke="#94a3b8" stroke-width="2"/><polygon points="150,272 144,260 156,260" fill="#94a3b8"/>
  <line x1="460" y1="232" x2="460" y2="262" stroke="#94a3b8" stroke-width="2"/><polygon points="460,272 454,260 466,260" fill="#94a3b8"/>
  <line x1="770" y1="232" x2="770" y2="262" stroke="#94a3b8" stroke-width="2"/><polygon points="770,272 764,260 776,260" fill="#94a3b8"/>

  <!-- Spot -->
  <rect x="40" y="274" width="220" height="104" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="150" y="302" text-anchor="middle" class="t lbl" font-size="16">Spot CEX</text>
  <text x="150" y="326" text-anchor="middle" class="m tiny">mini-cex · buy / sell</text>
  <text x="150" y="344" text-anchor="middle" class="m tiny">instant match on the book</text>
  <text x="150" y="366" text-anchor="middle" class="m tiny">:8030</text>

  <!-- Perp -->
  <rect x="350" y="274" width="220" height="104" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="460" y="302" text-anchor="middle" class="t lbl" font-size="16">Perpetuals</text>
  <text x="460" y="326" text-anchor="middle" class="m tiny">leverage · liquidation</text>
  <text x="460" y="344" text-anchor="middle" class="m tiny">funding, continuously settled</text>
  <text x="460" y="366" text-anchor="middle" class="m tiny">:8040</text>

  <!-- Prediction -->
  <rect x="660" y="274" width="220" height="104" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="1.6"/>
  <text x="770" y="302" text-anchor="middle" class="t lbl" font-size="16">Prediction market</text>
  <text x="770" y="326" text-anchor="middle" class="m tiny">YES / NO shares</text>
  <text x="770" y="344" text-anchor="middle" class="m tiny">an oracle resolves it once</text>
  <text x="770" y="366" text-anchor="middle" class="m tiny">:8050</text>

  <!-- arrows venues -> custody -->
  <line x1="150" y1="378" x2="150" y2="430" stroke="#94a3b8" stroke-width="2"/><polygon points="150,440 144,428 156,428" fill="#94a3b8"/>
  <line x1="460" y1="378" x2="460" y2="430" stroke="#94a3b8" stroke-width="2"/><polygon points="460,440 454,428 466,428" fill="#94a3b8"/>
  <line x1="770" y1="378" x2="770" y2="430" stroke="#94a3b8" stroke-width="2"/><polygon points="770,440 764,428 776,428" fill="#94a3b8"/>

  <!-- Custody band -->
  <rect x="40" y="442" width="840" height="92" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="460" y="472" text-anchor="middle" class="t lbl" font-size="16">On-chain custody — real testnet (Base Sepolia)</text>
  <text x="460" y="498" text-anchor="middle" class="m sub">verified deposit &amp; withdraw · each venue issues its own token · a hot wallet signs payouts</text>
  <text x="460" y="520" text-anchor="middle" class="m tiny">one engine · three venues · its own money system — built from the order book up</text>

  <text x="460" y="568" text-anchor="middle" class="m tiny">Instructor-designed and -architected for MB/CSE 599 AI Finance; implemented with AI (Claude Code). Source kept private (holds teacher keys).</text>
</svg>
